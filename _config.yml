# 网站基本配置
title: Renomee AI 文件整理博客
description: 聚焦AI文件重命名、文件命名规范与文件整理工作流的 supporting content hub，帮助普通用户更高效地整理文档、照片与下载文件
baseurl: "/renomee-ai"
url: "https://hetianhe2024.github.io"
lang: zh-CN

# 构建设置
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 文章URL格式（简化路径）
permalink: /posts/:title/

# SEO 设置
twitter:
  card: summary
  username: renomee_ai

social:
  name: Renomee AI
  links:
    - https://xiaojingxiu.com
    - https://renomeeai.com

# 作者信息
author:
  name: Renomee AI
  email: hetianhe2009@163.com

renomee:
  links:
    homepage: "https://renomeeai.com/"
    features: "https://renomeeai.com/en/product/features/"
    blog: "https://renomeeai.com/en/blog/"
    blog_windows: "https://renomeeai.com/en/blog/rename-1000-files-10-seconds-windows11/"
    blog_regex: "https://renomeeai.com/en/blog/ai-vs-regex-file-renaming/"
    blog_invoice: "https://renomeeai.com/en/blog/invoice-batch-rename-ocr/"
    blog_logistics: "https://renomeeai.com/en/blog/logistics-document-batch-rename/"
    blog_tools_compare: "https://renomeeai.com/en/blog/windows-batch-rename-tools-comparison/"
    docs_home: "https://renomeeai.readthedocs.io/en/latest/"
    docs_quickstart: "https://renomeeai.readthedocs.io/en/latest/quickstart/"
    docs_how_to: "https://renomeeai.readthedocs.io/en/latest/how-to/"
    docs_rename_content: "https://renomeeai.readthedocs.io/en/latest/how-to/rename-files-by-content/"
    docs_rename_pdf: "https://renomeeai.readthedocs.io/en/latest/how-to/rename-pdf-by-title/"
    docs_rename_scanned: "https://renomeeai.readthedocs.io/en/latest/how-to/rename-scanned-pdfs-automatically/"
    docs_photo_exif: "https://renomeeai.readthedocs.io/en/latest/how-to/batch-rename-photos-by-exif/"
    docs_use_cases: "https://renomeeai.readthedocs.io/en/latest/use-cases/"
    docs_research: "https://renomeeai.readthedocs.io/en/latest/use-cases/research/"
    docs_file_types: "https://renomeeai.readthedocs.io/en/latest/file-types/"

# 网站Logo
logo: /assets/images/logo.png

# 显示摘要
show_excerpts: true

# 分页设置
paginate: 10
paginate_path: "/page:num/"

# 排除不需要显示的文件
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - "*.py"
  - urls.txt

# 默认设置：根目录的所有markdown文件不进入sitemap
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      sitemap: false
  - scope:
      path: "_posts"
      type: "posts"
    values:
      sitemap: true

# 指定导航菜单显示的页面
header_pages:
  - index.md
  - about.md
  - categories.md
  - archive.md

# Google Analytics（可选）
# google_analytics: UA-XXXXXXXX-X

# 百度统计（可选）
# baidu_analytics: your_baidu_id
